<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="751" viewBox="0 0 1120 751" role="img" aria-label="Terminal trace of the ECB RAG agent answering a multi-document question with two searches and cited sources">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px}</style>
<rect x="0.5" y="0.5" width="1119" height="750" rx="12" fill="#0D1117" stroke="#30363D"/>
<path d="M0.5 12.5a12 12 0 0 1 12-12h1095a12 12 0 0 1 12 12V40H0.5z" fill="#161B22"/>
<line x1="0.5" y1="40" x2="1119.5" y2="40" stroke="#30363D"/>
<circle cx="24" cy="20" r="6" fill="#FF5F57"/><circle cx="44" cy="20" r="6" fill="#FEBC2E"/><circle cx="64" cy="20" r="6" fill="#28C840"/>
<text x="560.0" y="25" text-anchor="middle" fill="#8B949E" style="font-size:13px">ECB RAG Agent — python scripts/ask.py (real run, held-out question q37)</text>
<text x="36" y="96" xml:space="preserve"><tspan fill="#79C0FF" font-weight="700">User</tspan><tspan fill="#8B949E">  ›</tspan></text>
<text x="150" y="96" xml:space="preserve"><tspan fill="#E6EDF3">How many members did the NGFS have at its launch in 2017, and how many</tspan></text>
<text x="150" y="122" xml:space="preserve"><tspan fill="#E6EDF3">did Frank Elderson cite at COP16 in October 2024?</tspan></text>
<text x="150" y="148" xml:space="preserve"><tspan fill="#D29922"># held-out question: the two facts sit in two different speeches</tspan></text>
<text x="36" y="190" xml:space="preserve"><tspan fill="#79C0FF" font-weight="700">Agent</tspan><tspan fill="#8B949E">  ›</tspan></text>
<text x="150" y="190" xml:space="preserve"><tspan fill="#8B949E">iteration 1 · plans two searches in parallel</tspan></text>
<text x="150" y="216" xml:space="preserve"><tspan fill="#D29922"># the LLM chooses the tool and writes each query itself</tspan></text>
<text x="150" y="242" xml:space="preserve"><tspan fill="#8B949E">[1] </tspan><tspan fill="#3FB950" font-weight="700">OK  </tspan><tspan fill="#E6EDF3">search_speeches(</tspan><tspan fill="#58A6FF">"NGFS launch 2017 number of members"</tspan><tspan fill="#E6EDF3">)</tspan><tspan fill="#8B949E">   2.5 s</tspan></text>
<text x="150" y="268" xml:space="preserve"><tspan fill="#8B949E">[2] </tspan><tspan fill="#3FB950" font-weight="700">OK  </tspan><tspan fill="#E6EDF3">search_speeches(</tspan><tspan fill="#58A6FF">"Frank Elderson COP16 October 2024 NGFS</tspan></text>
<text x="150" y="294" xml:space="preserve"><tspan fill="#58A6FF">                     number of members"</tspan><tspan fill="#E6EDF3">)</tspan><tspan fill="#8B949E">   2.0 s</tspan></text>
<text x="150" y="320" xml:space="preserve"><tspan fill="#D29922"># each search: FAISS + BM25 → RRF fusion → LLM rerank → top-5 passages</tspan></text>
<text x="150" y="346" xml:space="preserve"><tspan fill="#8B949E">iteration 2 · answers from the evidence</tspan></text>
<text x="150" y="372" xml:space="preserve"><tspan fill="#8B949E">[3] </tspan><tspan fill="#3FB950" font-weight="700">OK  </tspan><tspan fill="#E6EDF3">final_answer</tspan><tspan fill="#8B949E">   citations checked against tool outputs</tspan></text>
<text x="150" y="398" xml:space="preserve"><tspan fill="#D29922"># ids no tool returned are rejected; an unsourced answer is blocked by the guard</tspan></text>
<text x="36" y="439" xml:space="preserve"><tspan fill="#7EE787" font-weight="700">Answer</tspan><tspan fill="#8B949E">  ›</tspan></text>
<text x="150" y="439" xml:space="preserve"><tspan fill="#E6EDF3">At its launch in 2017, the NGFS had 8 members </tspan><tspan fill="#58A6FF">[ecb-328#c2, ecb-120#c12,</tspan></text>
<text x="150" y="465" xml:space="preserve"><tspan fill="#58A6FF">ecb-137#c17]</tspan><tspan fill="#E6EDF3">. At COP16 in October 2024, Frank Elderson cited 141 members</tspan></text>
<text x="150" y="491" xml:space="preserve"><tspan fill="#58A6FF">[ecb-332#c1]</tspan><tspan fill="#E6EDF3">.</tspan></text>
<text x="150" y="517" xml:space="preserve"><tspan fill="#D29922"># every claim carries the id of the passage it comes from</tspan></text>
<text x="36" y="559" xml:space="preserve"><tspan fill="#79C0FF" font-weight="700">Sources</tspan><tspan fill="#8B949E"> ›</tspan></text>
<text x="150" y="559" xml:space="preserve"><tspan fill="#58A6FF">ecb-332#c1  </tspan><tspan fill="#8B949E">Frank Elderson · 2024-10-28 · Finance and Biodiversity Day, COP16 (video transcript)</tspan></text>
<text x="150" y="585" xml:space="preserve"><tspan fill="#58A6FF">ecb-328#c2  </tspan><tspan fill="#8B949E">Frank Elderson · 2024-10-04 · Sustainable finance: from “eureka!” to action</tspan></text>
<text x="150" y="611" xml:space="preserve"><tspan fill="#58A6FF">ecb-120#c12 </tspan><tspan fill="#8B949E">Frank Elderson · 2021-10-19 · The role of supervisors and central banks in the climate crisis</tspan></text>
<text x="150" y="637" xml:space="preserve"><tspan fill="#58A6FF">ecb-137#c17 </tspan><tspan fill="#8B949E">Frank Elderson · 2021-11-25 · When you need change to preserve continuity: climate…</tspan></text>
<text x="36" y="681" xml:space="preserve"><tspan fill="#8B949E">2 iterations · 3 tool calls · </tspan><tspan fill="#3FB950" font-weight="700">0 hallucinated calls</tspan><tspan fill="#8B949E"> · 5,561 tokens · $0.0030 · 6.9 s</tspan></text>
<text x="36" y="707" xml:space="preserve"><tspan fill="#D29922"># tokens, cost, latency and every tool call are metered on each run (and traced in LangFuse when keys are set)</tspan></text>
</svg>