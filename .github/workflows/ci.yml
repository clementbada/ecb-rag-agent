name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openai pydantic numpy pandas tabulate faiss-cpu rank-bm25 langgraph python-dotenv pytest
      - run: python -m pytest -q
